[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phdexlab-prototype"
version = "0.7.0"
description = "Standalone Windows chemistry workflow; no PhDex modifications"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6-Essentials>=6.7,<7", "openpyxl>=3.1.5,<4", "matplotlib>=3.9,<4", "SciencePlots>=2,<3", "pywin32>=306; sys_platform == 'win32'", "originpro>=1.1.12,<2; sys_platform == 'win32'"]

[tool.setuptools.package-data]
phdexlab = ["assets/*", "assets/toolbar/*"]

[project.scripts]
phdexlab = "phdexlab.__main__:main"

[tool.setuptools.packages.find]
include = ["phdexlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
